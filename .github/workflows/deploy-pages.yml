name: Build GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore Vite source entry
        shell: bash
        run: cp index.template.html index.html
      - name: Build
        run: npm run build
      - name: Publish build to branch root
        shell: bash
        run: |
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.html assets
          if git diff --cached --quiet; then
            echo "No generated site changes to publish."
          else
            git commit -m "chore: publish GitHub Pages build"
            git push
          fi